<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 Halaman Tidak Dijumpai | Penang Transportation Service</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/webp" href="/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --k: #0b0b0d;
      --ink: #17171a;
      --g: #a67c1f;
      --g2: #d4a73f;
      --g3: #f1d68a;
      --bg2: #faf7ef;
      --mu: #5f5b50;
      --ln: #ece6d3;
      --sh2: 0 24px 60px -20px rgba(30, 22, 0, .28);
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 50% 20%, rgba(212, 167, 63, .14), transparent 65%), var(--bg2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .box404 {
      max-width: 580px;
      width: 100%;
      background: #fff;
      border: 1px solid var(--ln);
      border-radius: 28px;
      padding: 56px 40px;
      box-shadow: var(--sh2);
    }
    .tag {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--g);
      background: rgba(212, 167, 63, .14);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    .code404 {
      font-size: clamp(72px, 14vw, 120px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.04em;
      background: linear-gradient(135deg, var(--k), var(--g) 55%, var(--g2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 14px;
    }
    h1 {
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 800;
      color: var(--k);
      margin-bottom: 14px;
      letter-spacing: -.02em;
    }
    p {
      color: var(--mu);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .cta {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: linear-gradient(135deg, var(--g3), var(--g2) 55%, #c4952c);
      color: #1a1405;
      padding: 14px 28px;
      font-weight: 700;
      font-size: 16px;
      border-radius: 999px;
      transition: transform .2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .btn.k {
      background: var(--k);
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="box404">
    <div class="tag">Error 404</div>
    <div class="code404">404</div>
    <h1>Halaman Tidak Dijumpai</h1>
    <p>Maaf, halaman yang anda tuju tidak wujud atau telah dialihkan. Sila kembali ke halaman utama atau hubungi kami melalui WhatsApp.</p>
    <div class="cta">
      <a href="/" class="btn">Kembali ke Beranda</a>
      <a href="https://wa.me/60102761963" target="_blank" rel="noopener" class="btn k">Hubungi WhatsApp</a>
    </div>
  </div>
</body>

</html>
